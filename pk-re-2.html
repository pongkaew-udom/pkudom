<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คลังบทความ - พงษ์แก้ว อุดมสมุทรหิรัญ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background: #f8fafc; overflow: hidden; }
    
    /* Sidebar */
    .sidebar { width: 300px; background: #0f172a; color: white; padding: 20px; display: flex; flex-direction: column; }
    .sidebar h2 { font-size: 1.25rem; margin-bottom: 6px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .sidebar h5 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; font-weight: normal; }
    
    .lab-list { list-style: none; overflow-y: auto; flex: 1; padding-right: 4px; }
    .lab-list::-webkit-scrollbar { width: 6px; }
    .lab-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    
    .lab-item { 
      padding: 14px 16px; 
      margin-bottom: 8px; 
      background: #1e293b; 
      border-radius: 8px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      border-left: 4px solid transparent; 
      font-size: 0.95rem;
    }
    .lab-item:hover, .lab-item.active { 
      background: #0284c7; 
      border-left-color: #38bdf8; 
      transform: translateX(4px); 
    }
    
    /* Main Viewer */
    .main-content { flex: 1; display: flex; flex-direction: column; }
    .header { height: 60px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .header h3 { color: #1e293b; font-size: 1.1rem; }
    .viewer { flex: 1; padding: 16px; background: #f1f5f9; }
    iframe { width: 100%; height: 100%; border: none; border-radius: 12px; background: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
  </style>
</head>
<body>

  <!-- เมนูด้านซ้าย -->
  <div class="sidebar">
    <h2>🔍 งานวิจัย</h2>
    <h5>โดย พงษ์แก้ว อุดมสมุทรหิรัญ</h5>
    <ul id="lab-list" class="lab-list">
      <!-- รายชื่อตอนนิยายจะถูกสร้างอัตโนมัติจาก JavaScript -->
    </ul>
  </div>

  <!-- หน้าต่างแสดงเนื้อหาบทความ -->
  <div class="main-content">
    <div class="header">
      <h3 id="lab-title">กรุณาเลือกบทความที่ต้องการอ่านจากเมนูด้านซ้าย</h3>
    </div>
    <div class="viewer">
      <iframe id="lab-frame" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    // 📌 ข้อมูลบทความ/ตอนต่างๆ (แก้ไข/เพิ่มบทนิยายตรงนี้)
    const novels = [
      { title: "🔍 ตัวนำยวดยิ่ง-SDW ", url: "paper-2026.html" },
      { title: "🔍 การใช้มือถือวัดสนามเเม่เหล็โลก", url: "s-mag.html" },
      { title: "🔍 ตัวนำยวดยิ่งกาโกเม", url: "kagome.html" },
      { title: "🔍 ตัวนำยวดยิ่ง MgB2", url: "mgb2.html" }
     
    ];

    const labListEl = document.getElementById('lab-list');
    const labFrame = document.getElementById('lab-frame');
    const labTitle = document.getElementById('lab-title');

    // สร้างรายการบทนิยายด้านซ้ายอัตโนมัติ
    novels.forEach((novel, index) => {
      const li = document.createElement('li');
      li.className = 'lab-item';
      li.innerText = novel.title;
      li.onclick = () => selectNovel(novel, li);
      labListEl.appendChild(li);

      // โหลดบทแรกขึ้นมาแสดงเป็นค่าเริ่มต้น
      if (index === 0) {
        selectNovel(novel, li);
      }
    });

    function selectNovel(novel, element) {
      // เปลี่ยนหน้า iframe และแสดงหัวข้อตอน
      labFrame.src = novel.url;
      labTitle.innerText = novel.title;

      // สลับสถานะ Active ของปุ่มเมนู
      document.querySelectorAll('.lab-item').forEach(item => item.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
